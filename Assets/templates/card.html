<div class="wrap">
    <div class="logo-block">
        <div>Белорусский национальный технический университет</div>
        <div>Научная библиотека</div>
    </div>
    <div class="data-block">
        <div class="text-block">
            <div>Билет № <span class="bold black">{codbar}</span></div>
            <div class="bold name black">{lastname}</div>
            <div class="bold name black">{givenNames}</div>
            <div>Факультет <span class="black">{faculty} гр. {group}</span></div>
            <div>Категория: <span class="black">{department}</span></div>
            <div>Дата выдачи: <span class="black" style="white-space: pre-wrap;"> {registrationDate}</span></div>
            <div>Действителен <br>до: <span class="black" style="white-space: pre-wrap;">                  {graduationDate}</span>
            </div>
        </div>
        <div class="img-block">
            <div class="photo-block"><img class="photo" src="photos/{portraitPath}"></div>
            <div class="barcode-block"><img class="barcode" src="codbars/{barcodePath}"></div>
        </div>
    </div>
</div>
