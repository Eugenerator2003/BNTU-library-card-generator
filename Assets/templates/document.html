<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{title}</title>
    <style>
        * {
            margin: 0px;
        }

        .paper {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            /* height: 297mm; */
            width: 212mm;
            gap: 5px;
            align-content: flex-start;
            padding-left: 30px;
            padding-top: 20px;
            page-break-after: always;
            transition: width 0.3s, margin 0.3s, opacity 0.3s;
        }

        .wrap {
            border: 1px solid gray;
            border-bottom: 1px solid gray;
            display: flex;
            flex-direction: column;
            width: 9cm;
            height: 5.34cm;
        }

        .logo-block {
            height: 1cm;
            width: 9cm;
            font-size: 14px;
            text-align: center;
            color: white;
            background-color: green;
            padding-top: 2px;
        }

        .data-block {
            width: inherit;
            height: 4.35cm;
            display: flex;
            flex-direction: row;
            color: #00005B;
        }

        .text-block,
        .img-block {
            height: inherit;
            display: flex;
            flex-direction: column;
        }

        .text-block {
            font-size: 10pt;
            width: 5.8cm;
            flex: 0 0 5.8cm;
        }

        .text-block>div {
            margin-bottom: 3px;
            margin-left: 4px;
        }

        .black {
            color: black;
        }

        .bold {
            font-weight: bold;
            font-size: 12pt;
        }

        .name {
            text-align: center;
        }

        .img-block {
            flex: 1;
        }

        .photo-block,
        .barcode-block {
            width: 3.2cm;
            overflow: hidden;
        }

        .photo-block {
            margin-bottom: 3px;
            height: 2.9cm;
        }

        .photo {
            height: inherit;
            position: relative;
            left: -10px;
        }

        .barcode {
            height: 1.3cm;
            width: 3.1cm;
        }

        h3 {
            font-weight: normal;
        }

        button {
            font-size: 16px;
            position: fixed;
            z-index: 100;
            border: 2px solid black;
            border-radius: 3px;
        }

        #editButton {
            margin: 2px 0 0 160px;
        }

        #printButton {
            margin: 2px 0 0 460px;
        }

        .edit-block {
            width: 8cm;
            height: max-content;
            font-size: 18px;
            border: 2px dashed purple;
            padding: 0px 10px 0 10px;
            overflow: hidden;
        }

        .number-block {
            font-size: 20px;
            text-align: center;
            margin-top: 5px;
        }

        hr {
            margin: 5px 0px 3px 0px;
            height: 1px;
            background-color: black;
        }

        .label-block {
            margin: 3px 0px 3px 0px;
        }

        input {
            font-size: 15px;
            width: inherit;
        }

        .slider {
            width: 6.7cm;
            margin-bottom: 5px;
        }

        .reset {
            width: 1cm;
            position: relative;
            margin: -5px 0px 5px 10px;
        }

        .border {
            border: 1px dashed black;
        }

        .vertical {
            height: 5.34cm;
            width: 0px;
            margin: 0 6px 0 6px;
        }

        .horizontal {
            width: 200mm;
            height: 0px;
            margin: 6px 0 6px 0;
        }

        @media print {

            button,
            .edit-block {
                display: none !important;
            }

            .paper {
                width: 212mm;
            }
        }
    </style>
</head>

<body>
    <button id="editButton" onclick="startEdit()">Войти в режим редактирования</button>
    <button id="printButton" onclick="window.print()">Печать</button>
    {papers}

    <script>
        window.addEventListener('DOMContentLoaded', () => checkCards());
        window.addEventListener('DOMContentLoaded', () => addBorders());

        function checkCards() {
            if (document.getElementsByClassName('wrap').length == 0) {
                document.getElementById('editButton').style.display = 'none';
            }
        }

        function addBorders() {
            let papers = document.querySelectorAll('.paper');
            for (const paper of papers) {
                const cards = paper.getElementsByClassName('wrap');
                for (let i = 0; i < cards.length; i++) {
                    const even = (i + 1) % 2 == 0;
                    if (!even) {
                        const div = document.createElement('div');
                        div.className = 'border vertical';
                        cards[i].after(div);
                    }

                    if (even && i + 1 < cards.length) {
                        const div = document.createElement('div');
                        div.className = 'border horizontal';
                        cards[i].after(div);
                    }
                }
            }
        }

        let controlCreated = false;

        const SLIDER_MIN = 0;
        const SLIDER_MAX = 200;
        const SLIDER_STEP = 1;
        const SLIDER_BASE = 100;

        function startEdit() {
            hideBorder();
            if (controlCreated) {
                animateEditBlockChanding('block');
            }
            else {
                const cards = getCardContainers();
                const firstPos = getPositions(cards);
                for (const card of cards) {
                    const cardEditBlock = createCardEditBlock(card);
                    card.after(cardEditBlock);
                }
                const lastPos = getPositions(cards);
                setTransform(cards, firstPos, lastPos);
                controlCreated = true;
            }
            document.getElementById('printButton').style.display = 'none';
            switchTo('Выйти из режима редактирования', endEdit);
        }

        function createCardEditBlock(cardElement) {
            const block = document.createElement('div');
            block.className = 'edit-block';

            const { numberBlock, number } = createNumberBlock(cardElement);
            const { lastnameLabel, lastnameInput } = createLastnameControl(cardElement, number);
            const { givenNamesLabel, givenNamesInput } = createGivenNamesControl(cardElement, number);
            const { sliderLabel, sliderInput } = createSliderControl(cardElement, number);

            block.appendChild(numberBlock);
            block.appendChild(lastnameLabel);
            block.appendChild(lastnameInput);
            block.appendChild(document.createElement('hr'));
            block.appendChild(givenNamesLabel);
            block.appendChild(givenNamesInput);
            block.appendChild(document.createElement('hr'));
            block.appendChild(sliderLabel);
            block.appendChild(sliderInput);

            const resetInput = createResetInput(cardElement, block);
            block.appendChild(resetInput);
            return block;
        }

        function createNumberBlock(cardElement) {
            const numberBlock = document.createElement('div');
            const number = cardElement.getElementsByClassName('bold black')[0].innerText;
            numberBlock.textContent = 'Билет №' + number;
            numberBlock.className = 'number-block';
            return { numberBlock, number };
        }

        function createLastnameControl(cardElement, number) {
            const lastnameLabel = document.createElement('div');
            lastnameLabel.textContent = 'Фамилия';
            lastnameLabel.className = 'label-block';
            const lastnameInput = document.createElement('input');
            lastnameInput.type = 'text';
            lastnameInput.id = `${number}_lastname`
            bindToLastname(cardElement, lastnameInput);
            return { lastnameLabel, lastnameInput };
        }

        function createGivenNamesControl(cardElement, number) {
            const givenNamesLabel = document.createElement('div');
            givenNamesLabel.textContent = 'Имя и отчество';
            givenNamesLabel.className = 'label-block';
            const givenNamesInput = document.createElement('input');
            givenNamesInput.type = 'text';
            givenNamesInput.id = `${number}_givenNames`
            bindToGivenNames(cardElement, givenNamesInput);
            return { givenNamesLabel, givenNamesInput };
        }

        function createSliderControl(cardElement, number) {
            const sliderLabel = document.createElement('div');
            sliderLabel.textContent = 'Яркость фотографии';
            sliderLabel.className = 'label-block';
            const sliderInput = document.createElement('input');
            sliderInput.type = 'range';
            sliderInput.ip = `${number}_slider`;
            sliderInput.className = 'slider';
            sliderInput.min = SLIDER_MIN;
            sliderInput.max = SLIDER_MAX;
            sliderInput.step = SLIDER_STEP;
            sliderInput.value = SLIDER_BASE;

            bindToImage(cardElement, sliderInput);

            return { sliderLabel, sliderInput };
        }

        function createResetInput(cardElement, editBlock) {
            const resetInput = document.createElement('input');
            resetInput.type = 'button';
            resetInput.className = 'reset';
            resetInput.value = '🔃';

            bindToReset(cardElement, editBlock, resetInput);

            return resetInput;
        }

        function bindToLastname(cardElement, input) {
            const lastnameDiv = cardElement.getElementsByClassName('bold name black')[0];
            input.value = lastnameDiv.textContent;

            input.addEventListener('input', (e) => {
                lastnameDiv.textContent = input.value;
            });
        }

        function bindToGivenNames(cardElement, input) {
            const givenNamesDiv = cardElement.getElementsByClassName('bold name black')[1];
            input.value = givenNamesDiv.textContent;

            input.addEventListener('input', (e) => {
                givenNamesDiv.textContent = input.value;
            });
        }

        function bindToImage(cardElement, sliderInput) {
            const img = cardElement.getElementsByClassName('photo')[0];

            sliderInput.addEventListener('input', (e) => {
                img.style.filter = `brightness(${sliderInput.value}%)`;
            });
        }

        function bindToReset(cardElement, editBlock, resetInput) {
            const image = cardElement.getElementsByClassName('photo')[0];

            const labels = cardElement.getElementsByClassName('bold name black');
            const lastnameLabel = labels[0];
            const givenNameLabel = labels[1];

            const inputs = editBlock.getElementsByTagName('input');
            const lastnameInput = inputs[0];
            const givenNameInput = inputs[1];
            const sliderInput = inputs[2];

            const lastnameValue = lastnameLabel.textContent;
            const givenNameValue = givenNameLabel.textContent;

            resetInput.addEventListener('click', (e) => {
                lastnameInput.value = lastnameValue;
                lastnameLabel.textContent = lastnameValue;

                givenNameInput.value = givenNameValue;
                givenNameLabel.textContent = givenNameValue;

                image.style.filter = `brightness(${SLIDER_BASE}%)`;
                sliderInput.value = 100;
            });
        }

        function switchTo(text, func) {
            const button = document.getElementById('editButton');
            button.onclick = () => func();
            button.innerText = text;
        }

        function animateEditBlockChanding(editBlockDisplay) {
            const items = getCardContainers();
            const first = getPositions(items);
            document.querySelectorAll('.edit-block').forEach(b => b.style.display = editBlockDisplay);
            const last = getPositions(items);
            setTransform(items, first, last);
        }

        function getCardContainers() {
            return [...document.getElementsByClassName('wrap')];
        }

        function getPositions(items) {
            const positions = items.map(el => el.getBoundingClientRect());
            return positions;
        }

        function setTransform(items, firstPos, lastPos) {
            items.forEach((el, i) => {
                const dx = firstPos[i].left - lastPos[i].left;
                const dy = firstPos[i].top - lastPos[i].top;
                if (dx || dy) {
                    el.style.transform = `translate(${dx}px, ${dy}px)`;
                    el.style.transition = 'none';
                    requestAnimationFrame(() => {
                        el.style.transform = '';
                        el.style.transition = 'transform 0.3s ease';
                    });
                }
            });
        }

        function showBorder() {
            [...document.getElementsByClassName('border')].forEach(el => el.style.display = 'block');
        }

        function hideBorder() {
            [...document.getElementsByClassName('border')].forEach(el => el.style.display = 'none');
        }

        function endEdit() {
            showBorder();
            animateEditBlockChanding('none');
            document.getElementById('printButton').style.display = 'block';
            switchTo('Войти в режим редактирования', startEdit);
        }
    </script>
</body>

</html>
