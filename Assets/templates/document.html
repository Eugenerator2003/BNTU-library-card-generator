<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{title}</title>
    <style>
        * {
            margin: 0px;
        }

        .paper {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            height: 295mm;
            width: 210mm;
            gap: 0px;
            align-content: flex-start;
            padding-left: 30px;
            padding-top: 50px;
            page-break-after: always;
        }

        .wrap {
            border: 1px solid gray;
            border-bottom: 3px solid gray;
            display: flex;
            flex-direction: column;
            width: 9cm;
            height: 5.34cm;
        }

        .wrap:nth-child(2n + 1) {
            border-right: 3px solid gray;
        }

        .wrap:nth-last-child(-n+2) {
            border-bottom: 1px solid gray;
        }

        .logo-block {
            height: 1cm;
            width: 9cm;
            font-size: 14px;
            text-align: center;
            color: white;
            background-color: green;
            padding-top: 2px;
        }

        .data-block {
            width: inherit;
            height: 4.35cm;
            display: flex;
            flex-direction: row;
            color: #00005B;
        }

        .text-block,
        .img-block {
            height: inherit;
            width: 5cm;
            display: flex;
            flex-direction: column;
        }

        .text-block {
            font-size: 10pt;
        }

        .text-block>div {
            margin-bottom: 3px;
            margin-left: 4px;
        }

        .black {
            color: black;
        }

        .bold {
            font-weight: bold;
            font-size: 12pt;
        }

        .name {
            text-align: center;
        }

        .img-block {
            width: 4cm;
        }

        .photo {
            height: 3cm;
            width: 3.95cm;
        }

        .barcode {
            height: 1cm;
            width: 3.95cm;
        }

        h3 {
            font-weight: normal;
        }
    </style>

</head>
<body>
    {papers}
</body>
</html>
