<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пример читательских билетов. 1 билет</title>
</head>
<style>
    .wrap {
        border: 1px solid gray;
        display: flex;
        flex-direction: column;
        width: 9cm;
        height: 5.34cm;
    }

    .logo-block {
        height: 1cm;
        width: 9cm;
        font-size: 14px;
        text-align: center;
        color: white;
        background-color: green;
        padding-top: 2px;
    }

    .data-block {
        width: inherit;
        height: 4.35cm;
        display: flex;
        flex-direction: row;
        color: #00005B;
    }

    .text-block,
    .img-block {
        height: inherit;
        display: flex;
        flex-direction: column;
    }

    .text-block {
        font-size: 10pt;
        width: 6.5cm;
    }

    .text-block>div {
        margin-bottom: 3px;
        margin-left: 4px;
    }

    .black {
        color: black;
    }

    .bold {
        font-weight: bold;
        font-size: 12pt;
    }

    .name {
        text-align: center;
    }

    .img-block {
        overflow: hidden;
    }

    .photo {
        height: 3cm;
        width: 4cm;
    }

    .barcode {
        height: 1.2cm;
        width: 4cm;
    }
</style>

<body>
    <div class="wrap">
        <div class="logo-block">
            <div>Белорусский национальный технический университет</div>
            <div>Научная библиотека</div>
        </div>
        <div class="data-block">
            <div class="text-block">
                <div>Билет № <span class="bold black">3212315</span></div>
                <div class="bold name black">Фамилия</div>
                <div class="bold name black">Имя Отчество</div>
                <div>Факультет <span class="black">ФИТР гр. 5884800</span></div>
                <div>Категория: <span class="black">Студенты ДО</span></div>
                <div>Дата выдачи: <span class="black" style="white-space: pre-wrap;"> 2025-09-01</span></div>
                <div>Действителен <br>до: <span class="black" style="white-space: pre-wrap;"> 2030-09-01</span></div>
            </div>
            <div class="img-block">
                <div class="photo-block"><img class="photo" src="portrait.png"></div>
                <div class="barcode-block"><img class="barcode" src="barcode.png"></div>
            </div>
        </div>
    </div>
</body>

</html>
